<style>
/* Layout: workflow-canvas metaphor — a dotted canvas, modules as connected nodes on a wire; sidebar outline + lesson pane */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --ink:#1b1d33; --muted:#5d6180; --line:#d9dbe7; --dot:#cdd0e0;
  --accent:#d63c66; --accent-soft:#fbe4ea; --done:#108a72; --done-soft:#dcf3ec; --warn:#a86400; --warn-soft:#fdf0d8;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131f; --surface:#1b1d2e; --ink:#e9eaf4; --muted:#9ea2c0; --line:#2d3048; --dot:#2a2c42;
  --accent:#ff6f93; --accent-soft:#3a1c29; --done:#3fd0ae; --done-soft:#123129; --warn:#f0b357; --warn-soft:#33270f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131f; --surface:#1b1d2e; --ink:#e9eaf4; --muted:#9ea2c0; --line:#2d3048; --dot:#2a2c42;
  --accent:#ff6f93; --accent-soft:#3a1c29; --done:#3fd0ae; --done-soft:#123129; --warn:#f0b357; --warn-soft:#33270f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}}

/* sidebar */
aside{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh;overflow:auto;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
@media (max-width:860px){aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  aside .outline{display:none} aside.open .outline{display:block}}
.brand{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.brand .eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand h1{font:800 22px/1.15 var(--display);margin:0;text-wrap:balance;cursor:pointer}
.meter{display:flex;flex-direction:column;gap:6px;margin:12px 0 16px}
.meter .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--done);width:0;transition:width .4s}
.meter small{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.toggle-outline{display:none;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:left}
@media (max-width:860px){.toggle-outline{display:block}}
.outline details{border-top:1px solid var(--line)}
.outline summary{list-style:none;cursor:pointer;padding:10px 0;display:flex;gap:10px;align-items:baseline}
.outline summary::-webkit-details-marker{display:none}
.outline summary .mnum{font:500 12px var(--mono);color:var(--accent);min-width:22px}
.outline summary .mt{font-weight:600;font-size:14px;line-height:1.3;flex:1}
.outline summary .mc{font:11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.outline ol{list-style:none;margin:0 0 10px;padding:0}
.outline li button{width:100%;text-align:left;border:0;background:none;padding:6px 8px 6px 32px;border-radius:6px;font-size:13px;line-height:1.35;display:flex;gap:8px;position:relative;color:var(--muted)}
.outline li button:hover{background:var(--bg);color:var(--ink)}
.outline li button.cur{background:var(--accent-soft);color:var(--ink);font-weight:500}
.outline li button::before{content:"";position:absolute;left:12px;top:11px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.outline li button.done::before{background:var(--done);border-color:var(--done)}

/* main */
main{min-width:0;padding-block:28px 64px;padding-left:max(16px,4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw)}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.hero{display:flex;flex-direction:column;gap:12px}
.hero .eyebrow,.lesson .eyebrow{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hero h2{font:800 clamp(30px,5vw,48px)/1.05 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.hero p{margin:0;max-width:62ch;color:var(--muted);font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 12px var(--mono);padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.setup h3{margin:0;font:700 18px var(--display)}
.setup ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* module chain */
.chain{display:flex;flex-direction:column;gap:0;position:relative}
.node{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;position:relative;padding-bottom:18px}
.node:not(:last-child)::after{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.port{width:44px;height:44px;border-radius:12px;background:var(--surface);border:2px solid var(--ink);display:grid;place-items:center;font:700 15px var(--mono);position:relative;z-index:1}
.node.complete .port{border-color:var(--done);background:var(--done-soft);color:var(--done)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
.card h4{margin:0;font:700 18px/1.25 var(--display)}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.card .mini{flex:1;min-width:80px;height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.card .mini i{display:block;height:100%;background:var(--done)}

/* lesson */
.lesson{display:flex;flex-direction:column;gap:20px}
.lesson h2{font:800 clamp(26px,4vw,38px)/1.1 var(--display);margin:4px 0 0;text-wrap:balance}
.lesson .meta{display:flex;flex-wrap:wrap;gap:8px}
.lesson .summary{font-size:16px;max-width:65ch;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font:700 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel ul,.panel ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.panel.build{border-left:4px solid var(--accent)}
.panel.caution{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.panel.caution strong{color:var(--warn)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lk{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;font-size:14px}
.lk:hover{border-color:var(--accent)}
.lk .tag{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.lk .tag.off{background:var(--done-soft);color:var(--done)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);padding:10px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.btn{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.isdone{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.btn:disabled{opacity:.4;cursor:default}
.nav{display:flex;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:0}
code{font:13px var(--mono);background:var(--bg);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

// --- build flat index
const lessons = [];
COURSE.forEach((m,mi)=>m.L.forEach((l,li)=>lessons.push({mi,li,id:`m${mi+1}l${li+1}`,t:l[0],dur:l[1],sum:l[2],learn:l[3],prac:l[4],q:l[5],docs:l[6],off:l[7],fin:l[8]})));
const secs = d => { if(!d) return 0; const [m,s]=d.split(":").map(Number); return m*60+s; };
const fmtMin = s => { const h=Math.floor(s/3600), m=Math.round((s%3600)/60); return h?`${h}h ${m}m`:`${m}m`; };
const totalSecs = lessons.reduce((a,l)=>a+secs(l.dur),0);

// --- per-viewer state
const KEY="n8n-course-v1";
let state={done:{},notes:{}};
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s) state=Object.assign(state,s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const modDone = mi => lessons.filter(l=>l.mi===mi&&state.done[l.id]).length;

function renderOutline(){
  const cur=location.hash.slice(1);
  $("#outline").innerHTML = COURSE.map((m,mi)=>{
    const ls=lessons.filter(l=>l.mi===mi);
    const open = ls.some(l=>l.id===cur);
    return `<details ${open?"open":""}><summary><span class="mnum">${String(mi+1).padStart(2,"0")}</span><span class="mt">${esc(m.t)}</span><span class="mc">${modDone(mi)}/${ls.length}</span></summary><ol>${
      ls.map(l=>`<li><button data-go="${l.id}" class="${state.done[l.id]?"done":""} ${l.id===cur?"cur":""}">${esc(l.t)}</button></li>`).join("")}</ol></details>`;
  }).join("");
  const n=Object.keys(state.done).filter(k=>state.done[k]).length;
  $("#barFill").style.width = (n/lessons.length*100)+"%";
  $("#barText").textContent = `${n} of ${lessons.length} lessons complete`;
}

function link(label,url,tag,cls){return `<a class="lk" href="${url}" target="_blank" rel="noopener"><span class="tag ${cls||""}">${tag}</span>${esc(label)}</a>`;}

function renderHome(){
  const next = lessons.find(l=>!state.done[l.id]) || lessons[0];
  $("#view").innerHTML = `
  <section class="hero">
    <span class="eyebrow">Self-paced course · ${COURSE.length} modules</span>
    <h2>The Complete AI Agents & AI Automation Course</h2>
    <p>Build AI agents and business automations in n8n without code. Every lesson has a short brief, reference videos to watch, a hands-on build to practice, and the official docs for the nodes you'll use.</p>
    <div class="stats"><span class="chip">${lessons.length} lessons</span><span class="chip">${fmtMin(totalSecs)} of video in the original outline</span><span class="chip">${COURSE.filter(m=>m.project).length} portfolio projects</span></div>
    <div><button class="btn primary" data-go="${next.id}">${Object.values(state.done).some(Boolean)?"Continue":"Start"}: ${esc(next.t)}</button></div>
  </section>
  <section class="setup">
    <h3>Before you start</h3>
    <ol>
      <li>Get n8n: the free cloud trial at <code>app.n8n.cloud/register</code>, or locally with <code>npm install -g n8n</code> then <code>n8n start</code>.</li>
      <li>Create an OpenAI API key and add a few dollars of credit. Other chat models work too.</li>
      <li>Use a Google account you don't mind connecting (Gmail, Calendar, Drive, Sheets), and make a free Supabase project when you reach Module 3.</li>
      <li>For each lesson: read the brief, watch one reference video, then do the build before marking it complete.</li>
    </ol>
    <div class="links">${link(...OFFICIAL.playlist,"Official video","off")}${link(...DOCS.learn,"Docs","off")}${link(...DOCS.forum,"Help","off")}</div>
  </section>
  <section class="chain">${COURSE.map((m,mi)=>{
    const ls=lessons.filter(l=>l.mi===mi), d=modDone(mi), s=ls.reduce((a,l)=>a+secs(l.dur),0);
    return `<div class="node ${d===ls.length?"complete":""}"><div class="port">${d===ls.length?"✓":mi+1}</div>
      <button class="card" data-go="${(ls.find(l=>!state.done[l.id])||ls[0]).id}">
        <h4>${esc(m.t)}</h4><p>${esc(m.d)}</p>
        ${m.project?`<p><strong>Project:</strong> ${esc(m.project)}</p>`:""}
        <div class="row"><span>${ls.length} lessons</span><span>${s?fmtMin(s):"—"}</span><span class="mini"><i style="width:${d/ls.length*100}%"></i></span><span>${d}/${ls.length}</span></div>
      </button></div>`;}).join("")}
  </section>`;
}

function renderLesson(l){
  const i=lessons.indexOf(l), m=COURSE[l.mi], prev=lessons[i-1], next=lessons[i+1], done=!!state.done[l.id];
  const offs=[...l.off,...(l.li===0?m.ref:[])].filter((v,k,a)=>a.indexOf(v)===k);
  $("#view").innerHTML = `
  <article class="lesson">
    <div><span class="eyebrow">Module ${l.mi+1} · ${esc(m.t)} · Lesson ${l.li+1} of ${m.L.length}</span>
    <h2>${esc(l.t)}</h2></div>
    <div class="meta">${l.dur?`<span class="chip">Original video ${l.dur}</span>`:`<span class="chip">Self-study lesson</span>`}${done?`<span class="chip" style="color:var(--done);border-color:var(--done)">Completed</span>`:""}</div>
    <p class="summary">${esc(l.sum)}</p>
    <div class="panel"><h3>What you'll learn</h3><ul>${l.learn.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="panel"><h3>Watch</h3>
      <div class="links">${offs.map(k=>link(...OFFICIAL[k],"Official","off")).join("")}${link(`YouTube: "${l.q}"`,YT(l.q),"Search")}</div>
      <p class="hint">Search links open current YouTube results for this exact topic. Pick a recent video, since n8n's interface changes often.</p></div>
    <div class="panel build"><h3>Build it</h3><ol>${l.prac.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
    ${l.fin?`<div class="panel caution"><p style="margin:0"><strong>Safety note.</strong> ${FIN}</p></div>`:""}
    <div class="panel"><h3>Docs & templates</h3><div class="links">${l.docs.map(k=>link(...DOCS[k],"Docs","off")).join("")}</div></div>
    <div class="panel"><h3>Your notes</h3><label for="notes" class="hint">Saved in this browser only.</label><textarea id="notes" placeholder="Credentials you set up, gotchas, ideas for clients…">${esc(state.notes[l.id]||"")}</textarea></div>
    <div class="actions">
      <button class="btn ${done?"isdone":"primary"}" id="markDone">${done?"Completed ✓ (undo)":"Mark complete"}</button>
      <div class="nav"><button class="btn" ${prev?`data-go="${prev.id}"`:"disabled"}>← Previous</button><button class="btn" ${next?`data-go="${next.id}"`:"data-go=\"home\""}>${next?"Next →":"Course home"}</button></div>
    </div>
  </article>`;
  $("#notes").addEventListener("input",e=>{state.notes[l.id]=e.target.value;save();});
  $("#markDone").addEventListener("click",()=>{
    state.done[l.id]=!state.done[l.id]; save();
    if(state.done[l.id]&&next){go(next.id);} else route();
  });
}

function route(){
  const id=location.hash.slice(1), l=lessons.find(x=>x.id===id);
  l?renderLesson(l):renderHome();
  renderOutline();
}
function go(id){
  if(id==="home"){ history.replaceState(null,"",location.pathname+location.search); route(); }
  else if(location.hash.slice(1)===id) route(); else location.hash=id;
  window.scrollTo({top:0});
  if(matchMedia("(max-width:860px)").matches){ $("#side").classList.remove("open"); $("#toggleOutline").setAttribute("aria-expanded","false"); $("#toggleOutline").textContent="Show course outline"; }
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]"); if(b){e.preventDefault();go(b.dataset.go);}});
$("#homeLink").addEventListener("click",()=>go("home"));
$("#homeLink").addEventListener("keydown",e=>{if(e.key==="Enter")go("home");});
$("#toggleOutline").addEventListener("click",e=>{const s=$("#side");s.classList.toggle("open");const o=s.classList.contains("open");e.target.setAttribute("aria-expanded",o);e.target.textContent=o?"Hide course outline":"Show course outline";});
window.addEventListener("hashchange",route);
route();
</script>
